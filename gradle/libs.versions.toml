[versions]
# Android API guard: Animal Sniffer 1.28 (2026-09-11) reads Java 25 class files; the plugin
# 2.0.1 (2025-04-28) only wraps it. Signatures: Android API 26 + desugar_jdk_libs_nio (0.16.0, 2026-09-30),
# stricter than the app minSdk 31 (no API 31 signature with desugaring exists)
animalsniffer = "1.28"
vyarus-animalsniffer = "2.0.1"
android-api-signature = "0.16.0"
gson = "2.15.0" # tests only (mock recording), never shipped; 2.15.0 released 2026-10-24
junit = "6.1.3" # 2026-08-07 (>= 7 days), latest stable; needs JDK 17+ (toolchain 25)
jsoup = "1.23.2"
# latest stable (2026-10-08); same version as the Watube app, so its stdlib is shared
kotlin = "2.4.21"
okhttp = "5.5.1"
protobuf-lib = "4.36.2"
protobuf-plugin = "0.10.0"
rhino = "1.9.2" # 1.9.x needs Android minSDK >= 26 (#1423): Watube targets 32; 1.9.2 turns Java serialization off by default and fixes a memory leak

[libraries]
android-api-signature = { module = "com.toasttab.android:gummy-bears-api-26", version.ref = "android-api-signature" }
google-gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
google-protobuf = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf-lib" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
mozilla-rhino-core = { module = "org.mozilla:rhino", version.ref = "rhino" }
squareup-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
google-protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
vyarus-animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "vyarus-animalsniffer" }
