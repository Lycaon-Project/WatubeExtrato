<svg xmlns="http://www.w3.org/2000/svg" width="3240" height="1080" viewBox="0 0 3240 1080">
  <title>WatubeExtrato, the privacy-first extraction engine of Watube</title>
  <defs><linearGradient id="play" gradientUnits="userSpaceOnUse" x1="8" y1="7" x2="17" y2="17"><stop offset="0" stop-color="#9BF25C"/><stop offset="1" stop-color="#1FD47E"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A3A2D"/><stop offset="1" stop-color="#0C1C16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#35E08C" stop-opacity="0.22"/><stop offset="1" stop-color="#35E08C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="610.0" cy="470.0" r="1150" gradientTransform="translate(610.0,470.0) scale(1,0.55) translate(-610.0,-470.0)">
      <stop offset="0" stop-color="#35E08C" stop-opacity="0.18"/><stop offset="1" stop-color="#35E08C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corner" cx="1" cy="0" r="0.75">
      <stop offset="0" stop-color="#5AB8FF" stop-opacity="0.10"/><stop offset="1" stop-color="#5AB8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BF25C"/><stop offset="1" stop-color="#35E08C"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#FFFFFF" fill-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="3240" height="1080" fill="#0E1013"/>
  <rect width="3240" height="1080" fill="url(#dots)"/>
  <rect width="3240" height="1080" fill="url(#halo)"/>
  <rect width="3240" height="1080" fill="url(#corner)"/>
  <g transform="translate(470,330)">
    <rect width="280" height="280" rx="64" fill="url(#tile)"/>
    <rect width="280" height="280" rx="64" fill="url(#glow)"/>
    <rect x="1.5" y="1.5" width="277" height="277" rx="62.5" fill="none" stroke="#35E08C" stroke-opacity="0.2" stroke-width="3"/>
    <g transform="translate(36.40,36.40) scale(8.6333)"><path d="M6.4,7 L2.6,12 L6.4,17 M17.6,7 L21.4,12 L17.6,17" fill="none" stroke="#35E08C" stroke-opacity="0.62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.4,8 L15.8,12 L9.4,16 Z" fill="url(#play)" stroke="url(#play)" stroke-width="2.2" stroke-linejoin="round"/></g>
  </g>
  <text x="814" y="530" font-family="Figtree, 'Segoe UI', Roboto, Arial, sans-serif" font-size="232" font-weight="800" letter-spacing="-6"><tspan fill="url(#word)">Watube</tspan><tspan fill="#F1F3F5">Extrato</tspan></text>
  <text x="822" y="620" font-family="Figtree, 'Segoe UI', Roboto, Arial, sans-serif" font-size="58" font-weight="500" fill="#A3ABB6">The privacy-first extraction engine behind Watube.</text>
  <g transform="translate(395,810)"><rect width="428" height="92" rx="46" fill="#1E2228" stroke="#2C3038" stroke-width="2"/><circle cx="48" cy="46" r="10" fill="#35E08C"/><text x="76" y="59" font-family="Figtree, 'Segoe UI', Roboto, Arial, sans-serif" font-size="38" font-weight="600" fill="#F1F3F5">SABR streaming</text></g><g transform="translate(851,810)"><rect width="560" height="92" rx="46" fill="#1E2228" stroke="#2C3038" stroke-width="2"/><circle cx="48" cy="46" r="10" fill="#35E08C"/><text x="76" y="59" font-family="Figtree, 'Segoe UI', Roboto, Arial, sans-serif" font-size="38" font-weight="600" fill="#F1F3F5">Sandboxed JavaScript</text></g><g transform="translate(1439,810)"><rect width="516" height="92" rx="46" fill="#1E2228" stroke="#2C3038" stroke-width="2"/><circle cx="48" cy="46" r="10" fill="#35E08C"/><text x="76" y="59" font-family="Figtree, 'Segoe UI', Roboto, Arial, sans-serif" font-size="38" font-weight="600" fill="#F1F3F5">Tracker-free links</text></g><g transform="translate(1983,810)"><rect width="560" height="92" rx="46" fill="#1E2228" stroke="#2C3038" stroke-width="2"/><circle cx="48" cy="46" r="10" fill="#35E08C"/><text x="76" y="59" font-family="Figtree, 'Segoe UI', Roboto, Arial, sans-serif" font-size="38" font-weight="600" fill="#F1F3F5">YouTube-only network</text></g><g transform="translate(2571,810)"><rect width="274" height="92" rx="46" fill="#1E2228" stroke="#2C3038" stroke-width="2"/><circle cx="48" cy="46" r="10" fill="#35E08C"/><text x="76" y="59" font-family="Figtree, 'Segoe UI', Roboto, Arial, sans-serif" font-size="38" font-weight="600" fill="#F1F3F5">GPL-3.0</text></g>
</svg>
